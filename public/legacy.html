<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altoque Peru WK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: thin; scrollbar-color: rgba(139,146,169,0.42) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(139,146,169,0.34); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: rgba(139,146,169,0.52); border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-button { width: 0; height: 0; display: none; }
:root {
  --bg: #0a0d14; --bg2: #111520; --bg3: #181d2c; --bg4: #1e2436;
  --card: #1a1f30; --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #e8ecf4; --text2: #8b92a9; --text3: #555e75;
  --accent: #4f8ef7; --accent2: #3d7aee;
  --green: #22c97a; --amber: #f5a623; --red: #ef4444; --purple: #a78bfa; --teal: #2dd4bf;
  --radius: 11px; --radius-sm: 7px;
  --sidebar-w-expanded: 232px; --sidebar-w-collapsed: 82px;
  --font: 'DM Sans', sans-serif; --font2: 'Space Grotesk', sans-serif;
}
html { background: var(--bg); }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 10px; overflow-x: hidden; }
body.modal-open { overflow: hidden; }
body.modal-open .main { overflow: hidden; }
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 380px; }
.login-logo { position: relative; text-align: center; margin-bottom: 2rem; min-height: 88px; padding-top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.login-logo .icon-wrap { display: none; }
.login-logo .brand { position: relative; z-index: 2; margin-top: 0; font-family: var(--font2); font-size: 0; font-weight: 700; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; }
.login-logo .brand::before { content: 'A'; color: #ffcc00; font-size: 46px; font-weight: 800; letter-spacing: -3px; text-shadow: 0 0 10px rgba(255,204,0,0.82), 0 0 24px rgba(255,204,0,0.36); }
.login-logo .brand::after { content: 'TK'; color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -3px; text-shadow: 0 0 10px rgba(255,255,255,0.24), 0 0 20px rgba(255,255,255,0.11); }
.login-logo .sub { position: relative; z-index: 2; margin-top: 1px; font-size: 0; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; animation-delay: .12s; }
.login-logo .sub::before { content: 'ALTOQUE PERU '; font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.2px; text-shadow: 0 0 6px rgba(255,255,255,0.12); }
.login-logo .sub::after { content: 'WK'; font-size: 14px; font-weight: 700; color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.68); }
@keyframes borderFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
@keyframes shineMove { 0% { left: -250px; } 100% { left: 550px; } }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
.field input { width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 14px; outline: none; transition: border 0.2s; }
.field input:focus { border-color: var(--accent); }
.password-field { position: relative; }
.password-field input { padding-right: 48px; }
.toggle-pass { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; }
.toggle-pass:hover { color: var(--text); }
.remember-row { display: flex; align-items: center; gap: 8px; margin: -2px 0 12px; color: var(--text2); font-size: 12px; cursor: pointer; user-select: none; }
.remember-row input { width: 16px; height: 16px; accent-color: var(--accent); }
.btn-primary { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-family: var(--font2); font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--accent2); }
.login-hint { display: none; font-size: 11px; color: var(--text3); text-align: center; margin-top: 1.5rem; line-height: 1.8; }
.login-hint strong { color: var(--text2); }
.err-msg { font-size: 12px; color: var(--red); margin-bottom: 10px; display: none; }
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: var(--sidebar-w-expanded); min-width: var(--sidebar-w-expanded); height: 100vh; position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: .85rem 0 0; flex-shrink: 0; transition: width .22s ease, min-width .22s ease; }
.app.sidebar-collapsed .sidebar { width: var(--sidebar-w-collapsed); min-width: var(--sidebar-w-collapsed); }
.sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 .9rem .8rem; }
.sidebar-logo { position: relative; width: 140px; height: 50px; margin: 0; border-bottom: none; background: transparent; overflow: visible; box-shadow: none; backdrop-filter: none; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .18s ease, transform .18s ease; }
.sidebar-logo::before, .sidebar-logo::after { display: none; }
.sidebar-logo .brand { position: relative; z-index: 2; margin-top: 0; text-align: center; font-family: var(--font2); font-size: 0; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; }
.sidebar-logo .brand::before { content: 'A'; color: #ffcc00; font-size: 28px; font-weight: 800; letter-spacing: -2px; text-shadow: 0 0 9px rgba(255,204,0,0.84), 0 0 20px rgba(255,204,0,0.36); }
.sidebar-logo .brand::after { content: 'TK'; color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -2px; text-shadow: 0 0 8px rgba(255,255,255,0.24), 0 0 18px rgba(255,255,255,0.1); }
.sidebar-logo .sub { position: relative; z-index: 2; margin-top: -1px; text-align: center; font-size: 0; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; animation-delay: .12s; }
.sidebar-logo .sub::before { content: 'ALTOQUE PERU '; font-size: 8px; font-weight: 700; color: #fff; letter-spacing: -0.1px; text-shadow: 0 0 5px rgba(255,255,255,0.12); }
.sidebar-logo .sub::after { content: 'WK'; font-size: 8px; font-weight: 700; color: #ffcc00; text-shadow: 0 0 7px rgba(255,204,0,0.62); }
@keyframes logoFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.sidebar-toggle { width: 32px; height: 32px; border-radius: 10px; border: 1px solid rgba(79,142,247,.18); background: rgba(79,142,247,.06); color: var(--text2); font-family: var(--font2); font-size: 18px; line-height: 1; cursor: pointer; transition: all .15s; flex-shrink: 0; }
.sidebar-toggle:hover { color: var(--text); border-color: rgba(79,142,247,.34); background: rgba(79,142,247,.12); }
.nav { flex: 1; overflow-y: auto; padding: 0 .7rem .9rem; scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.28) transparent; }
.nav-section + .nav-section { margin-top: .85rem; padding-top: .8rem; border-top: 1px solid rgba(255,255,255,.055); }
.nav-section-title { padding: 0 .6rem .5rem; color: var(--text3); font-size: 9px; font-weight: 800; letter-spacing: 1.15px; text-transform: uppercase; }
.nav-section-items { display: grid; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 8px .7rem; border-radius: 10px; cursor: pointer; color: var(--text2); font-size: 11px; font-weight: 500; transition: all 0.15s; position: relative; min-height: 37px; }
.nav-item:hover { color: var(--text); background: var(--bg3); }
.nav-item.active { color: var(--accent); background: rgba(79,142,247,0.1); box-shadow: inset 0 0 0 1px rgba(79,142,247,.08); }
.nav-item.active::before { content: ''; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
.nav-icon { width: 18px; text-align: center; font-size: 15px; line-height: 1; flex-shrink: 0; }
.nav-label { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge { min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px; background: linear-gradient(135deg, rgba(79,142,247,1), rgba(61,122,238,1)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; line-height: 1; box-shadow: 0 8px 16px rgba(79,142,247,.25); flex-shrink: 0; }
.nav-item[data-nav="alertas"] .nav-badge { background: linear-gradient(135deg, #ff7a59, #ff4d4f); }
.nav-item[data-nav="llamadas"] .nav-badge { background: linear-gradient(135deg, #34d399, #22c97a); }
.nav-item[data-nav="penalidades"] .nav-badge { background: linear-gradient(135deg, #ff6b6b, #ef4444); }
.sidebar-footer { flex-shrink: 0; padding: .9rem; border-top: 1px solid var(--border); }
.user-badge { display: flex; align-items: center; gap: 10px; min-width: 0; }
.user-avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.user-name { font-size: 12px; font-weight: 500; }
.user-role { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.logout-btn { font-size: 11px; color: var(--text3); cursor: pointer; margin-top: 8px; text-align: center; padding: 6px 8px; border-radius: 8px; }
.logout-btn:hover { color: var(--red); background: rgba(239,68,68,0.1); }
.sidebar-top-actions { padding: 0 1rem .85rem; }
.logout-btn.top { width: 100%; margin-top: 0; padding: 8px 10px; border: 1px solid rgba(79,142,247,.24); background: rgba(79,142,247,.06); color: var(--text2); }
.logout-btn.top:hover { color: var(--red); border-color: rgba(239,68,68,.32); background: rgba(239,68,68,0.1); }
.logout-btn.bottom { margin-top: 10px; }
.app-version { margin-top: 10px; text-align: center; font-size: 10px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }
.main { flex: 1; height: 100vh; overflow-y: auto; padding: 1.15rem; margin-left: var(--sidebar-w-expanded); transition: margin-left .22s ease; }
.app.sidebar-collapsed .main { margin-left: var(--sidebar-w-collapsed); }
.app.sidebar-collapsed .nav-section-title,
.app.sidebar-collapsed .nav-label,
.app.sidebar-collapsed .user-meta,
.app.sidebar-collapsed .logout-btn.bottom,
.app.sidebar-collapsed .app-version,
.app.sidebar-collapsed .sidebar-logo { display: none; }
.app.sidebar-collapsed .sidebar-head { justify-content: center; padding-inline: .65rem; }
.app.sidebar-collapsed .sidebar-top-actions { padding-inline: .65rem; }
.app.sidebar-collapsed .logout-btn.top { padding: 8px; font-size: 16px; }
.app.sidebar-collapsed .nav { padding-inline: .55rem; }
.app.sidebar-collapsed .nav-section + .nav-section { margin-top: .8rem; padding-top: .8rem; }
.app.sidebar-collapsed .nav-item { justify-content: center; padding-inline: .55rem; gap: 0; }
.app.sidebar-collapsed .nav-item.active::before { left: -7px; }
.app.sidebar-collapsed .nav-badge { position: absolute; top: 5px; right: 5px; min-width: 17px; height: 17px; padding-inline: 4px; font-size: 9px; }
.app.sidebar-collapsed .user-badge { justify-content: center; }
.app.sidebar-collapsed .sidebar-footer { padding-inline: .65rem; }
.app.sidebar-collapsed .nav-item::after { content: attr(data-tooltip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%) translateX(-6px); background: rgba(17,21,32,0.98); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; color: var(--text); padding: 8px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 18px 40px rgba(0,0,0,.35); transition: opacity .16s ease, transform .16s ease; z-index: 60; }
.app.sidebar-collapsed .nav-item:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.page-header { margin-bottom: 1.15rem; }
.page-title { font-family: var(--font2); font-size: 17px; font-weight: 700; }
.page-sub { font-size: 10px; color: var(--text2); margin-top: 4px; }
.hero-banner { position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(79,142,247,0.16), rgba(45,212,191,0.08) 48%, rgba(167,139,250,0.12)); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 1rem 1.15rem; margin-bottom: 1rem; }
.hero-banner::before { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; top: -110px; background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 68%); pointer-events: none; }
.hero-kicker { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #b8c7ea; font-weight: 700; margin-bottom: 7px; }
.hero-name { font-family: var(--font2); font-size: 30px; line-height: 1.02; font-weight: 700; max-width: 720px; }
.hero-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.hero-chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(9,13,20,0.35); font-size: 11px; color: var(--text); }
.hero-chip-label { color: var(--text2); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
.stat-card { background: radial-gradient(circle at 16% 0%, rgba(79,142,247,0.09), transparent 34%), linear-gradient(145deg, rgba(26,31,48,0.92), rgba(18,23,37,0.92)); border: 1px solid rgba(255,255,255,0.075); border-radius: var(--radius); padding: .85rem; box-shadow: inset 0 1px 0 rgba(255,255,255,0.025), 0 18px 45px rgba(0,0,0,0.12); }
.stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }
.stat-value { font-family: var(--font2); font-size: 22px; font-weight: 700; line-height: 1; }
.stat-value.green { color: var(--green); }
.stat-value.amber { color: var(--amber); }
.stat-value.red { color: var(--red); }
.stat-sub { font-size: 10px; color: var(--text3); margin-top: 6px; }
.table-wrap { background: linear-gradient(145deg, rgba(26,31,48,0.94), rgba(18,23,37,0.94)); border: 1px solid rgba(255,255,255,0.075); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.2rem; box-shadow: inset 0 1px 0 rgba(255,255,255,0.025), 0 18px 45px rgba(0,0,0,0.12); }
.table-header { padding: .8rem .9rem; border-bottom: 1px solid rgba(255,255,255,0.065); display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap; background: rgba(10,13,20,0.12); }
.table-title { font-family: var(--font2); font-weight: 600; font-size: 13px; flex: 1; min-width: 120px; }
.report-dashboard { display: grid; gap: 1rem; }
.dash-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; }
.dash-card { min-height: 106px; padding: 1rem; border: 1px solid rgba(255,255,255,0.075); border-radius: var(--radius); background: radial-gradient(circle at 12% 0%, rgba(79,142,247,0.12), transparent 38%), linear-gradient(145deg, rgba(26,31,48,0.94), rgba(18,23,37,0.94)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.025), 0 18px 45px rgba(0,0,0,0.12); }
.dash-card .label { font-size: 10px; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.dash-card .value { font-family: var(--font2); font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
.mini-text { margin-top: 8px; color: var(--text2); font-size: 11px; line-height: 1.35; }
.chart-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; padding: .65rem; border-radius: 16px; background: linear-gradient(135deg, rgba(79,142,247,.09), rgba(45,212,191,.035)); border: 1px solid rgba(79,142,247,.12); }
.chart-panel { min-width: 0; min-height: 246px; background: linear-gradient(180deg, rgba(20,28,48,.98), rgba(14,20,36,.99)); border-color: rgba(90,122,196,.24); box-shadow: 0 14px 34px rgba(0,0,0,.2); }
.chart-panel .table-header { background: rgba(17,26,46,.8); border-bottom-color: rgba(90,122,196,.2); }
.chart-panel .table-title { color: #f8fbff; }
.chart-body { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 1rem; align-items: center; padding: 1rem; }
.chart-panel .pie-chart { position: relative; display: grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; border: 0; box-shadow: 0 12px 28px rgba(0,0,0,.28); flex: 0 0 auto; }
.chart-panel .pie-chart::before { content: ''; position: absolute; inset: 25%; border-radius: 50%; background: #111a2d; box-shadow: inset 0 0 0 1px rgba(232,239,252,.12); }
.pie-center { position: absolute; z-index: 1; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; pointer-events: none; }
.pie-center strong { max-width: 90px; color: #f8fbff; font-family: var(--font2); font-size: 12px; line-height: 1.1; font-weight: 800; white-space: nowrap; }
.pie-center span { margin-top: 4px; color: #93a4c8; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
.chart-legend { display: grid; gap: 12px; min-width: 0; }
.chart-panel .chart-legend-row { display: grid; grid-template-columns: minmax(0,1fr) auto; justify-content: space-between; gap: 8px; align-items: center; color: #b9c6e3; font-size: 12px; }
.chart-legend-row span { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.chart-legend-row i { width: 9px; height: 9px; border-radius: 999px; flex: 0 0 auto; }
.chart-panel .chart-legend-row strong { display: grid; justify-items: end; gap: 2px; color: #f8fbff; font-family: var(--font2); font-size: 12px; white-space: nowrap; }
.chart-legend-row strong small { color: #93a4c8; font-family: var(--font); font-size: 9px; font-weight: 600; }
.chart-note { margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(90,122,196,.2); color: #a9b8d4; font-size: 11px; line-height: 1.45; }
.mini-bar { height: 9px; min-width: 92px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
.mini-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--green)); }
@media (max-width: 1120px) {
  .dash-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .chart-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .chart-panel:last-child { grid-column: 1 / -1; }
  .chart-body { grid-template-columns: 132px minmax(0,1fr); gap: .8rem; }
  .chart-panel .pie-chart { width: 132px; height: 132px; }
}
@media (max-width: 720px) {
  .dash-grid, .chart-grid { grid-template-columns: 1fr; }
  .chart-panel:last-child { grid-column: auto; }
  .chart-body { grid-template-columns: 112px minmax(0,1fr); gap: .8rem; }
  .chart-panel .pie-chart { width: 112px; height: 112px; }
}
@media (max-width: 520px) {
  .chart-grid { padding: .4rem; gap: .6rem; }
  .chart-body { grid-template-columns: 96px minmax(0,1fr); gap: .65rem; padding: .8rem; }
  .chart-panel .pie-chart { width: 96px; height: 96px; }
  .chart-panel .chart-legend-row { font-size: 10px; }
}
.search-input { padding: 6px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 11px; outline: none; }
.search-input:focus { border-color: var(--accent); }
.filter-select { padding: 6px 9px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 11px; outline: none; }
.manager-preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; padding: .9rem 1rem; border: 1px solid rgba(79,142,247,.32); border-radius: 16px; background: linear-gradient(135deg, rgba(37,99,235,.16), rgba(20,184,166,.10)); box-shadow: 0 12px 28px rgba(0,0,0,.16); }
.manager-preview-bar strong { display: block; color: var(--text); font-family: var(--font2); font-size: 14px; margin-bottom: 3px; }
.manager-preview-bar span { color: var(--text2); font-size: 12px; }
.manager-preview-bar .filter-select { min-width: 190px; min-height: 36px; }
.btn-sm { padding: 6px 12px; border: 1px solid var(--accent); border-radius: var(--radius-sm); color: var(--accent); background: transparent; font-family: var(--font2); font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn-sm:hover { background: var(--accent); color: #fff; }
.btn-sm.danger { border-color: var(--red); color: var(--red); }
.btn-sm.danger:hover { background: var(--red); color: #fff; }
.btn-sm.success { border-color: var(--green); color: var(--green); }
