<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altoque Peru WK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0d14; --bg2: #111520; --bg3: #181d2c; --bg4: #1e2436;
  --card: #1a1f30; --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #e8ecf4; --text2: #8b92a9; --text3: #555e75;
  --accent: #4f8ef7; --accent2: #3d7aee;
  --green: #22c97a; --amber: #f5a623; --red: #ef4444; --purple: #a78bfa; --teal: #2dd4bf;
  --radius: 12px; --radius-sm: 8px;
  --font: 'DM Sans', sans-serif; --font2: 'Space Grotesk', sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 380px; }
.login-logo { position: relative; text-align: center; margin-bottom: 2rem; min-height: 88px; padding-top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.login-logo .icon-wrap { display: none; }
.login-logo .brand { position: relative; z-index: 2; margin-top: 0; font-family: var(--font2); font-size: 0; font-weight: 700; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; }
.login-logo .brand::before { content: 'A'; color: #ffcc00; font-size: 46px; font-weight: 800; letter-spacing: -3px; text-shadow: 0 0 10px rgba(255,204,0,0.82), 0 0 24px rgba(255,204,0,0.36); }
.login-logo .brand::after { content: 'TK'; color: #fff; font-size: 46px; font-weight: 800; letter-spacing: -3px; text-shadow: 0 0 10px rgba(255,255,255,0.24), 0 0 20px rgba(255,255,255,0.11); }
.login-logo .sub { position: relative; z-index: 2; margin-top: 1px; font-size: 0; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; animation-delay: .12s; }
.login-logo .sub::before { content: 'ALTOQUE PERU '; font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.2px; text-shadow: 0 0 6px rgba(255,255,255,0.12); }
.login-logo .sub::after { content: 'WK'; font-size: 14px; font-weight: 700; color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.68); }
@keyframes borderFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
@keyframes shineMove { 0% { left: -250px; } 100% { left: 550px; } }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
.field input { width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 14px; outline: none; transition: border 0.2s; }
.field input:focus { border-color: var(--accent); }
.password-field { position: relative; }
.password-field input { padding-right: 48px; }
.toggle-pass { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; }
.toggle-pass:hover { color: var(--text); }
.btn-primary { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-family: var(--font2); font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--accent2); }
.login-hint { display: none; font-size: 11px; color: var(--text3); text-align: center; margin-top: 1.5rem; line-height: 1.8; }
.login-hint strong { color: var(--text2); }
.err-msg { font-size: 12px; color: var(--red); margin-bottom: 10px; display: none; }
.app { display: flex; min-height: 100vh; }
.sidebar { width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 0; }
.sidebar-logo { position: relative; width: 152px; height: 56px; margin: 0 auto 1rem; border-bottom: none; background: transparent; overflow: visible; box-shadow: none; backdrop-filter: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.sidebar-logo::before, .sidebar-logo::after { display: none; }
.sidebar-logo .brand { position: relative; z-index: 2; margin-top: 0; text-align: center; font-family: var(--font2); font-size: 0; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; }
.sidebar-logo .brand::before { content: 'A'; color: #ffcc00; font-size: 31px; font-weight: 800; letter-spacing: -2px; text-shadow: 0 0 9px rgba(255,204,0,0.84), 0 0 20px rgba(255,204,0,0.36); }
.sidebar-logo .brand::after { content: 'TK'; color: #fff; font-size: 31px; font-weight: 800; letter-spacing: -2px; text-shadow: 0 0 8px rgba(255,255,255,0.24), 0 0 18px rgba(255,255,255,0.1); }
.sidebar-logo .sub { position: relative; z-index: 2; margin-top: -1px; text-align: center; font-size: 0; color: transparent; animation: logoFloat 4.4s ease-in-out infinite; animation-delay: .12s; }
.sidebar-logo .sub::before { content: 'ALTOQUE PERU '; font-size: 9px; font-weight: 700; color: #fff; letter-spacing: -0.1px; text-shadow: 0 0 5px rgba(255,255,255,0.12); }
.sidebar-logo .sub::after { content: 'WK'; font-size: 9px; font-weight: 700; color: #ffcc00; text-shadow: 0 0 7px rgba(255,204,0,0.62); }
@keyframes logoFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 1.25rem; cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 500; transition: all 0.15s; position: relative; }
.nav-item:hover { color: var(--text); background: var(--bg3); }
.nav-item.active { color: var(--accent); background: rgba(79,142,247,0.1); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
.nav-icon { width: 20px; text-align: center; }
.sidebar-footer { margin-top: auto; padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
.user-badge { display: flex; align-items: center; gap: 10px; }
.user-avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.user-name { font-size: 13px; font-weight: 500; }
.user-role { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.logout-btn { font-size: 11px; color: var(--text3); cursor: pointer; margin-top: 8px; text-align: center; padding: 4px; border-radius: 4px; }
.logout-btn:hover { color: var(--red); background: rgba(239,68,68,0.1); }
.app-version { margin-top: 10px; text-align: center; font-size: 10px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }
.main { flex: 1; overflow-y: auto; padding: 2rem; }
.page-header { margin-bottom: 1.5rem; }
.page-title { font-family: var(--font2); font-size: 22px; font-weight: 700; }
.page-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
.hero-banner { position: relative; overflow: hidden; background: linear-gradient(135deg, rgba(79,142,247,0.16), rgba(45,212,191,0.08) 48%, rgba(167,139,250,0.12)); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 1.5rem 1.6rem; margin-bottom: 1.5rem; }
.hero-banner::before { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; top: -110px; background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 68%); pointer-events: none; }
.hero-kicker { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #b8c7ea; font-weight: 700; margin-bottom: 8px; }
.hero-name { font-family: var(--font2); font-size: 34px; line-height: 1.02; font-weight: 700; max-width: 720px; }
.hero-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.hero-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(9,13,20,0.35); font-size: 12px; color: var(--text); }
.hero-chip-label { color: var(--text2); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
.stat-label { font-size: 11px; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }
.stat-value { font-family: var(--font2); font-size: 26px; font-weight: 700; line-height: 1; }
.stat-value.green { color: var(--green); }
.stat-value.amber { color: var(--amber); }
.stat-value.red { color: var(--red); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.5rem; }
.table-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.table-title { font-family: var(--font2); font-weight: 600; font-size: 14px; flex: 1; min-width: 120px; }
.search-input { padding: 7px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 13px; outline: none; }
.search-input:focus { border-color: var(--accent); }
.filter-select { padding: 7px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 13px; outline: none; }
.btn-sm { padding: 7px 14px; border: 1px solid var(--accent); border-radius: var(--radius-sm); color: var(--accent); background: transparent; font-family: var(--font2); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn-sm:hover { background: var(--accent); color: #fff; }
.btn-sm.danger { border-color: var(--red); color: var(--red); }
.btn-sm.danger:hover { background: var(--red); color: #fff; }
.btn-sm.success { border-color: var(--green); color: var(--green); }
.btn-sm.success:hover { background: var(--green); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th { padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; text-align: left; border-bottom: 1px solid var(--border); background: var(--bg2); }
td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.015); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge.registro { background: rgba(79,142,247,0.15); color: #7bb3fa; border: 1px solid rgba(79,142,247,0.25); }
.badge.operacion { background: rgba(34,201,122,0.15); color: #4de09a; border: 1px solid rgba(34,201,122,0.25); }
.badge.drive { background: rgba(167,139,250,0.15); color: #c4affe; border: 1px solid rgba(167,139,250,0.2); }
.badge.web { background: rgba(45,212,191,0.15); color: #5ee7d4; border: 1px solid rgba(45,212,191,0.2); }
.badge.dup { background: rgba(239,68,68,0.15); color: #f77171; border: 1px solid rgba(239,68,68,0.3); font-size: 10px; }
.days-chip { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.days-chip.ok { background: rgba(34,201,122,0.12); color: var(--green); }
.days-chip.warn { background: rgba(245,166,35,0.12); color: var(--amber); }
.days-chip.danger { background: rgba(239,68,68,0.12); color: var(--red); }
.days-chip.done { background: rgba(34,201,122,0.1); color: var(--green); }
.days-chip.expired { background: rgba(239,68,68,0.1); color: var(--red); }
.action-btn { padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.15s; }
.action-btn:hover { background: var(--bg3); color: var(--text); }
.alert-row td { background: rgba(245,166,35,0.03) !important; }
.dup-row td { background: rgba(239,68,68,0.03) !important; }
.alert-banner { background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.2); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: flex-start; gap: 12px; }
.alert-banner .ab-icon { font-size: 18px; margin-top: 1px; }
.alert-banner .ab-text { font-size: 13px; color: #f8bb59; line-height: 1.5; }
.alert-banner .ab-text strong { font-weight: 700; }
.commission-big { background: linear-gradient(135deg, rgba(79,142,247,0.12), rgba(167,139,250,0.08)); border: 1px solid rgba(79,142,247,0.2); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1.5rem; }
.comm-label { font-size: 11px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
.comm-value { font-family: var(--font2); font-size: 44px; font-weight: 700; line-height: 1; }
.comm-sub { font-size: 13px; color: var(--text2); margin-top: 8px; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
.tab { padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.form-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; max-width: 560px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1/-1; }
.form-label { font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: 0.3px; text-transform: uppercase; }
.form-input, .form-select { padding: 10px 13px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font); font-size: 14px; outline: none; transition: border 0.2s; width: 100%; }
.form-input:focus, .form-select:focus { border-color: var(--accent); }
.submit-btn { margin-top: 1.25rem; padding: 12px 24px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-family: var(--font2); font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.submit-btn:hover { background: var(--accent2); }
.users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.user-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
.uc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.uc-name { font-weight: 600; font-size: 14px; }
.uc-username { font-size: 11px; color: var(--text3); }
.uc-stat { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); padding: 5px 0; border-top: 1px solid var(--border); }
.uc-stat span:last-child { font-weight: 600; color: var(--text); }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); }
.empty-state .es-icon { font-size: 32px; margin-bottom: 0.75rem; }
.empty-state p { font-size: 14px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
.modal { background: var(--card); border: 1px solid var(--border2); border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 480px; }
.modal h3 { font-family: var(--font2); font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
.modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }
.btn-cancel { padding: 9px 18px; background: transparent; border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); font-family: var(--font); font-size: 13px; cursor: pointer; }
.btn-cancel:hover { background: var(--bg3); color: var(--text); }
input[type=date] { color-scheme: dark; }
.busy-overlay { position: fixed; inset: 0; background: rgba(10,13,20,0.58); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 1400; }
.busy-overlay.show { display: flex; }
.busy-card { min-width: 220px; max-width: 320px; background: rgba(26,31,48,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 1rem 1.1rem; box-shadow: 0 24px 60px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 12px; }
.busy-spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.16); border-top-color: var(--accent); animation: busySpin 0.8s linear infinite; flex-shrink: 0; }
.busy-text { font-size: 13px; color: var(--text); }
@keyframes busySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<div id="busyOverlay" class="busy-overlay" aria-hidden="true">
  <div class="busy-card">
    <div class="busy-spinner"></div>
    <div id="busyText" class="busy-text">Procesando...</div>
  </div>
</div>
<script>

const WARN_DAY = 6;
const EXPIRE_DAY = 7;
const AUTO_REFRESH_MS = 3000;

const COLORS = ['#22c97a','#a78bfa','#f5a623','#2dd4bf','#f472b6','#60a5fa'];

let USERS = [];

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; }
function daysSince(ds){ return Math.floor((new Date()-new Date(ds))/86400000); }
function fmt(ds){ if(!ds) return '-'; const [y,m,d]=ds.split('-'); return `${d}/${m}/${y}`; }
function fmtDateTime(ds){
  if(!ds) return '-';
  const dt=new Date(ds);
  if(Number.isNaN(dt.getTime())) return ds;
  const dd=String(dt.getDate()).padStart(2,'0');
  const mm=String(dt.getMonth()+1).padStart(2,'0');
  const yyyy=dt.getFullYear();
  const hh=String(dt.getHours()).padStart(2,'0');
  const mi=String(dt.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
}
function initials(n){ return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function getUserById(id){ return USERS.find(u=>u.id===id)||{name:'?',color:'#888'}; }

let RECORDS = [];
let ATTENDANCE = null;
let ATTENDANCE_LOADING = false;
let ATTENDANCE_ERROR = '';

let state = {
  view:'login', currentUser:null, modal:null, newModal:false, resetUserId:null, sessionPassword:'',
  ft:'', fUser:'', fTipo:'', fDesde:'', fHasta:'', fApproval:'', fSede:'',
  reportMode:'all', reportUser:'', attendanceSearch:'', attendanceDate:'', attendancePerson:'', attendanceEdit:null,
  attendanceTab:'resumen', adminTab:'users', alertTab:'warn'
};
const PAYROLL_ROLE_OPTIONS = ['Jefe de Pagos','Encargado de Pagos','Jefe de Sede','Personal Registro','Facturacion','Marketing','Sin definir'];
const PAYROLL_ROLE_CONFIG = {
  'Jefe de Pagos': { baseSalary:3000, penaltyPerMinute:1.5, bonus:100 },
  'Encargado de Pagos': { baseSalary:2000, penaltyPerMinute:1.0, bonus:100 },
  'Jefe de Sede': { baseSalary:1500, penaltyPerMinute:0.7, bonus:150 },
  'Personal Registro': { baseSalary:1250, penaltyPerMinute:0.5, bonus:50 },
  'Facturacion': { baseSalary:1500, penaltyPerMinute:0.7, bonus:50 },
  'Marketing': { baseSalary:0, penaltyPerMinute:0, bonus:0 },
  'Sin definir': { baseSalary:0, penaltyPerMinute:0, bonus:0 },
};
const SEDES = ['Centro','Sur','Norte'];
let SETTINGS = { commissionPerRecord: 0.40 };
let BOOTING = true;
let AUTO_REFRESH_TIMER = null;
let BUSY_COUNT = 0;
let BUSY_MESSAGE = 'Procesando...';
let NEW_RECORD_SUBMITTING = false;
let EDIT_RECORD_SUBMITTING = false;

function getDups(records){
  const seen={};
  records.forEach(r=>{ if(!seen[r.dni]) seen[r.dni]=[]; seen[r.dni].push(r.id); });
  const s=new Set();
  Object.values(seen).forEach(ids=>{ if(ids.length>1) ids.forEach(id=>s.add(id)); });
  return s;
}

function getCommissionRate(){
  return Number(SETTINGS.commissionPerRecord||0);
}
function updateBusyOverlay(){
  const overlay=document.getElementById('busyOverlay');
  const text=document.getElementById('busyText');
  if(text) text.textContent=BUSY_MESSAGE;
  if(overlay){
    overlay.classList.toggle('show', BUSY_COUNT>0);
    overlay.setAttribute('aria-hidden', BUSY_COUNT>0 ? 'false' : 'true');
  }
}
function showBusy(message){
  BUSY_COUNT += 1;
  BUSY_MESSAGE = message || 'Procesando...';
  updateBusyOverlay();
}
function hideBusy(){
  BUSY_COUNT = Math.max(0, BUSY_COUNT-1);
  if(BUSY_COUNT===0) BUSY_MESSAGE='Procesando...';
  updateBusyOverlay();
}
function getCommissionableRecordsForUser(user){
  if(!user) return [];
  if(user.role==='manager'){
    return RECORDS.filter(r=>{
      if(!r.validatedAt) return false;
      const owner=getUserById(r.userId);
      return userSede(owner)===userSede(user) && (owner.role==='employee' || owner.id===user.id);
    });
  }
  if(user.role==='employee') return RECORDS.filter(r=>r.userId===user.id&&!!r.validatedAt);
  return [];
}

  return records.filter(r=>(!userId||r.userId===userId)&&!!r.validatedAt).length * getCommissionRate();

function normalizeSede(sede){ return sede==='Lince'?'Centro':(sede||'Centro'); }

function getVisibleUsers(){

function canManageUser(user){

async function apiFetch(url, options={}){
  const fetchOptions={...options};
  const silent=!!fetchOptions.silent;
  delete fetchOptions.silent;
  if(!silent) showBusy(fetchOptions.busyMessage || 'Procesando...');
  delete fetchOptions.busyMessage;
  const response = await fetch(url, {
    credentials:'same-origin',
    cache:'no-store',
    ...fetchOptions,
    headers:{
      'Content-Type':'application/json',
      ...(fetchOptions.headers||{})
    }
  });
  try{
    const payload = await response.json().catch(()=>({}));
    if(!response.ok){
      const error = new Error(payload.error || 'Error de servidor');
      error.status = response.status;
      error.payload = payload;
      throw error;
    }
    return payload;
  } finally {
    if(!silent) hideBusy();
  }
}
async function refreshState(silent=false){
  const payload = await apiFetch('/api/state', { method:'GET', silent, busyMessage:'Actualizando información...' });
  applyStatePayload(payload);
  return payload;
}

function todayStr(){ return new Date().toISOString().split('T')[0]; }
function recordAge(r){ return daysSince(r.fecha); }
function operationDelay(r){
  if(!r.fechaOperacion) return null;
  return Math.floor((new Date(r.fechaOperacion)-new Date(r.fecha))/86400000);
}
function operatedWithinWindow(r){
  const d=operationDelay(r);
  return d!==null && d>=0 && d<=EXPIRE_DAY;
}
function isPendingApproval(r){
  return r.tipo==='operacion' && !!r.fechaOperacion && operatedWithinWindow(r) && !r.validatedAt && !r.rejectedAt;
}
function isApprovalLocked(r){
  return isPendingApproval(r) || !!r.validatedAt || !!r.rejectedAt;
}
function canValidateRecord(r){
  return isPendingApproval(r);
}
function validationText(r){
  if(r.validatedAt) return { cls:'done', label:`Validado ${fmt(r.validatedAt)}` };
  if(r.rejectedAt) return { cls:'expired', label:'Rechazado' };
  if(r.tipo==='operacion' && !r.fechaOperacion) return { cls:'warn', label:'Falta fecha de operación' };
  if(r.tipo==='operacion' && !operatedWithinWindow(r)) return { cls:'expired', label:'Operó fuera de plazo' };
  if(isPendingApproval(r)) return { cls:'danger', label:'Pendiente de aprobación' };
  if(r.tipo==='registro' && recordAge(r)>EXPIRE_DAY) return { cls:'expired', label:'Sin operación válida' };
  return { cls:'ok', label:'Aún sin validar' };
}

function shortTime(value){
  return value ? String(value).slice(0,5) : '—';
}
function minutesLabel(value){
  if(!value) return '0 min';
  const hours=Math.floor(value/60);
  const minutes=value%60;
  return hours ? `${hours}h ${String(minutes).padStart(2,'0')}m` : `${minutes} min`;
}
function monthWorkdays(year, monthIndex){
  let total=0;
  const day=new Date(year, monthIndex, 1);
  while(day.getMonth()===monthIndex){
    if(day.getDay()!==0) total += 1;
    day.setDate(day.getDate()+1);
  }
  return total;
}
function attendanceDayWorked(day){
  return !!(day.entryTime || day.exitTime);
}
function timeMinutesOrNull(value){
  if(!value) return null;
  const parts=String(value).split(':').map(Number);
  if(parts.length<2 || parts.some(Number.isNaN)) return null;
  return (parts[0]*60) + parts[1];
}
function computeAttendancePayment(day, person){
  const dateObj=new Date(`${day.date}T00:00:00`);
  if(dateObj.getDay()===0) return { dailyPay:0, latePenalty:0, bonusPoints:0, workedHours:0 };
  const entryMinutes=timeMinutesOrNull(day.entryTime);
  const exitMinutes=timeMinutesOrNull(day.exitTime);
  const roleConfig=PAYROLL_ROLE_CONFIG[person.payrollRole || 'Sin definir'] || PAYROLL_ROLE_CONFIG['Sin definir'];
  const monthlySalary=Number(person.monthlySalary || roleConfig.baseSalary || 0);
  const hourlyRate=((monthlySalary/26)/8);
  const latePenalty=(day.lateMinutes||0) * Number(roleConfig.penaltyPerMinute || 0);
  const isAbsence=(day.entryStatus==='Sin entrada' && day.exitStatus==='Sin salida');
  let bonusPoints=0;
  if(!isAbsence && day.entryStatus!=='Tarde'){
    bonusPoints=1;
  }
  if(entryMinutes===null || exitMinutes===null || isAbsence){
    return { dailyPay:0, regularPay:0, overtimePay:0, latePenalty, bonusPoints, workedHours:0, regularHours:0, overtimeHours:0 };
  }
  const effectiveStart=Math.max(entryMinutes, 9*60);
  const regularEnd=Math.min(exitMinutes, 18*60);
  const regularHours=Math.max(0, ((regularEnd - effectiveStart) / 60) - 1);
  const overtimeHours=Math.max(0, (exitMinutes - (18*60)) / 60);
  const firstTwoExtra=Math.min(2, overtimeHours);
  const remainingExtra=Math.max(0, overtimeHours - 2);
  const regularPay=regularHours * hourlyRate;
  const overtimePay=(firstTwoExtra * hourlyRate * 1.25) + (remainingExtra * hourlyRate * 1.35);
  const workedHours=regularHours + overtimeHours;
  const dailyPay=Math.max(0, regularPay + overtimePay - latePenalty);
  return { dailyPay, regularPay, overtimePay, latePenalty, bonusPoints, workedHours, regularHours, overtimeHours };
}
function getSalaryPeople(){
  if(!ATTENDANCE?.people?.length) return [];
  const today=new Date();
  const currentYear=today.getFullYear();
  const currentMonth=today.getMonth();
  const workdays=monthWorkdays(currentYear, currentMonth);
  let people=getAttendancePeople().map(person=>{
    const monthDays=person.days.filter(day=>{
      const dt=new Date(`${day.date}T00:00:00`);
      return dt.getFullYear()===currentYear && dt.getMonth()===currentMonth;
    });
    const roleConfig=PAYROLL_ROLE_CONFIG[person.payrollRole || 'Sin definir'] || PAYROLL_ROLE_CONFIG['Sin definir'];
    const monthlySalary=Number(person.monthlySalary || roleConfig.baseSalary || 0);
    const dayPayments=monthDays.map(day=>({
      ...day,
      ...computeAttendancePayment(day, { ...person, monthlySalary, payrollRole: person.payrollRole || 'Sin definir' })
    }));
    const workedDays=dayPayments.filter(day=>day.dailyPay>0 || attendanceDayWorked(day)).length;
    const missingDays=Math.max(0, workdays - workedDays);
    const totalDailyPay=dayPayments.reduce((sum, day)=>sum + Number(day.dailyPay || 0), 0);
    const totalLatePenalty=dayPayments.reduce((sum, day)=>sum + Number(day.latePenalty || 0), 0);
    const totalBonusPoints=dayPayments.reduce((sum, day)=>sum + Number(day.bonusPoints || 0), 0);
    const totalExtraMinutes=dayPayments.reduce((sum, day)=>sum + Number(day.overtimeMinutes || 0), 0);
    return {
      ...person,
      monthDays,
      dayPayments,
      workedDays,
      missingDays,
      monthlySalary,
      dailyRate: workdays ? monthlySalary / workdays : 0,
      hourlyRate: ((monthlySalary/26)/8),
      estimatedSalary: totalDailyPay,
      totalDailyPay,
      totalLatePenalty,
      totalBonusPoints,
      totalExtraMinutes
    };
  });
  if(state.attendancePerson){
    people=people.filter(person=>person.personId===state.attendancePerson);
  }
  if(state.attendanceSearch){
    const q=state.attendanceSearch.toLowerCase();
    people=people.filter(person=>
      person.personName.toLowerCase().includes(q) ||
      person.personId.toLowerCase().includes(q)
    );
  }
  const totalConfiguredSalary=people.reduce((sum, person)=>sum+person.monthlySalary,0);
  return { people, workdays, totalConfiguredSalary, monthLabel: new Intl.DateTimeFormat('es-PE', { month:'long', year:'numeric' }).format(today) };
}

  let rows=ATTENDANCE.people.flatMap(person=>

  return rows;
}

function bindLogin(){
  const userInput=document.getElementById('lu');
  const passInput=document.getElementById('lp');
  const err=document.getElementById('le');
  const form=document.getElementById('loginForm');
  const toggleBtn=document.getElementById('tp');
  const go=async()=>{
    const username=userInput.value.trim();
    const password=passInput.value;
    try{
      const payload = await apiFetch('/api/auth/login', {
        method:'POST',
        body:JSON.stringify({ username, password }),
        busyMessage:'Ingresando al sistema...'
      });
      state.sessionPassword=password;
      applyStatePayload(payload);
      render();
    }catch(error){
      err.textContent='Usuario o contraseña incorrectos';
      err.style.display='block';
    }
  };
  form.onsubmit=async e=>{ e.preventDefault(); await go(); };
  [userInput, passInput].forEach(input=>{
    input.oninput=()=>{ err.style.display='none'; };
    input.onkeydown=async e=>{ if(e.key==='Enter'){ e.preventDefault(); await go(); } };
  });
  toggleBtn.onclick=()=>{
    const isHidden=passInput.type==='password';
    passInput.type=isHidden?'text':'password';
    toggleBtn.textContent=isHidden?'Ocultar':'Ver';
    passInput.focus();
  };
  userInput.focus();
}

function bindForcePassword(){
  const form=document.getElementById('resetForm');

  form.onsubmit=async e=>{
    e.preventDefault();
    const p1=document.getElementById('rp1').value;
    const p2=document.getElementById('rp2').value;
    if(p1.length<6){ err.textContent='La contraseña debe tener al menos 6 caracteres'; err.style.display='block'; return; }
    if(p1!==p2){ err.textContent='Las contraseñas no coinciden'; err.style.display='block'; return; }
    try{
      await apiFetch('/api/settings/password', {
        method:'POST',
        body:JSON.stringify({ currentPassword: state.sessionPassword, newPassword:p1, repeatPassword:p2 })
      });
      state.sessionPassword=p1;
      await refreshState();
      render();
    }catch(error){
      err.textContent=error.message || 'No se pudo actualizar la contraseña';
      err.style.display='block';
    }
  };
}

function renderApp(){
  let content='';
  const v=state.view;
  const roleLabel=state.currentUser.role==='admin'?'Admin General':state.currentUser.role==='manager'?'Jefe de sede':'Atención al cliente';
  const hello=`<div class="hero-banner"><div class="hero-kicker">Panel de trabajo</div><div class="hero-name">Hola ${state.currentUser.name}</div><div class="hero-meta"><span class="hero-chip"><span class="hero-chip-label">Sede</span><strong>${userSede(state.currentUser)}</strong></span><span class="hero-chip"><span class="hero-chip-label">Cargo</span><strong>${roleLabel}</strong></span></div></div>`;
  if(v==='dashboard') content=renderDashboard();
  else if(v==='estadisticas') content=renderEstadisticas();
  else if(v==='asistencia') content=renderAsistencia();
  else if(v==='todos') content=renderTodos();
  else if(v==='alertas') content=renderAlertas();
  else if(v==='admin') content=renderAdmin();
  else if(v==='reportes') content=renderReportes();
  else if(v==='mis-registros') content=renderMisRegistros();
  else if(v==='mis-comisiones') content=renderMisComisiones();
  return `<div class="app">${renderSidebar()}<main class="main">${hello}${content}</main></div><div id="mr"></div>`;
}

function renderDashboard(){
  const visibleRecords=getVisibleRecords();
  const dups=getDups(visibleRecords);
  const alerts=visibleRecords.filter(r=>r.tipo==='registro'&&daysSince(r.fecha)===WARN_DAY);
  const expired=visibleRecords.filter(r=>r.tipo==='registro'&&daysSince(r.fecha)>EXPIRE_DAY);
  const ops=visibleRecords.filter(r=>!!r.validatedAt);
  const pendingValidation=visibleRecords.filter(r=>canValidateOrReject(r));
  const regs=visibleRecords.filter(r=>r.tipo==='registro'&&daysSince(r.fecha)<=EXPIRE_DAY);
  const totalComm=visibleRecords.filter(r=>!!r.validatedAt).length * getCommissionRate();

  let h=`<div class="page-header"><div class="page-title">Dashboard General</div><div class="page-sub">Vista completa de comisiones y estado de clientes</div></div>`;
  if(alerts.length>0) h+=`<div class="alert-banner"><div class="ab-icon">⚠️</div><div class="ab-text"><strong>${alerts.length} cliente(s) en día 6</strong> — mañana vence el plazo. Informar a las empleadas para actualizar si ya operaron.</div></div>`;
  if(pendingValidation.length>0) h+=`<div class="alert-banner"><div class="ab-icon">✅</div><div class="ab-text"><strong>${pendingValidation.length} registro(s) listos para validar</strong> — operaron dentro de los 7 días y ya puedes validarlos en cualquier momento.</div></div>`;
  h+=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Total Comisiones</div><div class="stat-value green">S/ ${totalComm.toFixed(2)}</div><div class="stat-sub">${ops.length} operaciones confirmadas</div></div>
    <div class="stat-card"><div class="stat-label">Pendientes en Plazo</div><div class="stat-value amber">${regs.length}</div><div class="stat-sub">Potencial S/ ${(regs.length*getCommissionRate()).toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Pendientes de Aprobación</div><div class="stat-value amber">${pendingValidation.length}</div><div class="stat-sub">Esperando revisión</div></div>
    <div class="stat-card"><div class="stat-label">Duplicados</div><div class="stat-value red">${Math.round(dups.size/2)||0}</div><div class="stat-sub">DNIs repetidos</div></div>
    <div class="stat-card"><div class="stat-label">Expirados sin Operación</div><div class="stat-value red">${expired.length}</div><div class="stat-sub">Sin comisión</div></div>
  </div>`;
  h+=`<div style="margin-bottom:1.5rem"><div style="font-family:var(--font2);font-size:14px;font-weight:600;margin-bottom:1rem">${isAdmin()?'Comisiones por usuario':'Comisiones de tu sede'}</div><div class="users-grid">`;
  getVisibleUsers().filter(u=>u.role!=='admin'&&(!isManager()||u.id!==state.currentUser.id)).forEach(u=>{
    const userRecords=visibleRecords.filter(r=>r.userId===u.id);
    const c=calcUserCommission(u);
    const o=userRecords.filter(r=>!!r.validatedAt).length;
    const rr=userRecords.filter(r=>r.tipo==='registro'&&daysSince(r.fecha)<=EXPIRE_DAY).length;
    h+=`<div class="stat-card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">${avatar(u,30,11)}<div style="font-size:13px;font-weight:600">${u.name}</div></div>
      <div style="font-family:var(--font2);font-size:22px;font-weight:700;color:var(--green)">S/ ${c.toFixed(2)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">${o} validadas · ${rr} pendientes</div></div>`;
  });
  h+='</div></div>';
  return h;
}

function renderEstadisticas(){
  const visibleRecords=getVisibleRecords();
  const visibleUsers=getVisibleUsers().filter(u=>u.role!=='admin');
  const totalRecords=visibleRecords.length;
  const virtualCount=visibleRecords.filter(r=>(r.modalidad||'virtual')==='virtual').length;
  const presencialCount=visibleRecords.filter(r=>r.modalidad==='presencial').length;
  const validatedCount=visibleRecords.filter(r=>!!r.validatedAt).length;
  const pendingApprovalCount=visibleRecords.filter(r=>isPendingApproval(r)).length;
  const operationCount=visibleRecords.filter(r=>r.tipo==='operacion').length;
  const registrationCount=visibleRecords.filter(r=>r.tipo==='registro').length;
  const virtualPct=totalRecords?((virtualCount/totalRecords)*100):0;
  const presencialPct=totalRecords?((presencialCount/totalRecords)*100):0;
  const avgPerUser=visibleUsers.length?(totalRecords/visibleUsers.length):0;
  const ranking=visibleUsers.map(user=>{
    const userRecords=visibleRecords.filter(r=>r.userId===user.id);
    const validated=userRecords.filter(r=>!!r.validatedAt).length;
    const pending=userRecords.filter(r=>isPendingApproval(r)).length;
    return {
      user,
      total:userRecords.length,
      validated,
      pending,
      commission:calcUserCommission(user),
      virtual:userRecords.filter(r=>(r.modalidad||'virtual')==='virtual').length,
      presencial:userRecords.filter(r=>r.modalidad==='presencial').length
    };
  }).sort((a,b)=>b.total-a.total || b.validated-a.validated || a.user.name.localeCompare(b.user.name));

  let h=`<div class="page-header"><div class="page-title">Estadísticas</div><div class="page-sub">${isAdmin()?'Resumen general de todos los usuarios':'Resumen general de tu sede y tu equipo'}</div></div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Registros Totales</div><div class="stat-value">${totalRecords}</div><div class="stat-sub">${visibleUsers.length} usuario(s) visibles</div></div>
    <div class="stat-card"><div class="stat-label">Virtuales</div><div class="stat-value green">${virtualCount}</div><div class="stat-sub">${virtualPct.toFixed(1)}% del total</div></div>
    <div class="stat-card"><div class="stat-label">Presenciales</div><div class="stat-value amber">${presencialCount}</div><div class="stat-sub">${presencialPct.toFixed(1)}% del total</div></div>
    <div class="stat-card"><div class="stat-label">Validados</div><div class="stat-value green">${validatedCount}</div><div class="stat-sub">${pendingApprovalCount} pendientes de aprobación</div></div>
    <div class="stat-card"><div class="stat-label">Promedio por Atención al cliente</div><div class="stat-value">${avgPerUser.toFixed(1)}</div><div class="stat-sub">${operationCount} operaciones · ${registrationCount} registros</div></div>
  </div>`;

  h+=`<div class="table-wrap" style="margin-bottom:1.5rem"><div class="table-header"><div class="table-title">Distribución de modalidad</div></div><div style="padding:1.25rem">
    <div style="display:grid;grid-template-columns:1fr;gap:1rem">
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px"><span>💻 Virtual</span><strong style="color:var(--text)">${virtualCount} · ${virtualPct.toFixed(1)}%</strong></div>
        <div style="height:12px;border-radius:999px;background:var(--bg3);overflow:hidden"><div style="width:${virtualPct}%;height:100%;background:linear-gradient(90deg, rgba(79,142,247,0.95), rgba(45,212,191,0.8))"></div></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px"><span>🏢 Presencial</span><strong style="color:var(--text)">${presencialCount} · ${presencialPct.toFixed(1)}%</strong></div>
        <div style="height:12px;border-radius:999px;background:var(--bg3);overflow:hidden"><div style="width:${presencialPct}%;height:100%;background:linear-gradient(90deg, rgba(245,166,35,0.95), rgba(255,204,0,0.8))"></div></div>
      </div>
    </div>
  </div></div>`;

  h+=`<div class="table-wrap"><div class="table-header"><div class="table-title">Ranking de atención al cliente con más registros</div></div>
  <table><thead><tr><th>#</th><th>Atención al cliente</th><th>Sede</th><th>Total Registros</th><th>Virtual</th><th>Presencial</th><th>Validados</th><th>Pendientes Aprobación</th><th>Comisión</th></tr></thead><tbody>`;
  ranking.forEach((row,index)=>{
    h+=`<tr>
      <td><span style="font-family:var(--font2);font-weight:700">${index+1}</span></td>
      <td><div style="display:flex;align-items:center;gap:8px">${avatar(row.user,28,10)}<div><div style="font-weight:600">${row.user.name}</div><div style="font-size:11px;color:var(--text3)">@${row.user.username}</div></div></div></td>
      <td>${userSede(row.user)}</td>
      <td style="font-weight:700">${row.total}</td>
      <td>${row.virtual}</td>
      <td>${row.presencial}</td>
      <td style="color:var(--green);font-weight:600">${row.validated}</td>
      <td style="color:var(--amber);font-weight:600">${row.pending}</td>
      <td style="color:var(--green);font-weight:700">S/ ${row.commission.toFixed(2)}</td>
    </tr>`;
  });
  if(!ranking.length) h+=`<tr><td colspan="9"><div class="empty-state"><div class="es-icon">📈</div><p>Aún no hay atención al cliente con registros visibles para mostrar estadísticas.</p></div></td></tr>`;
  h+='</tbody></table></div>';
  return h;
}

function renderAsistencia(){
  let h=`<div class="page-header"><div class="page-title">Control de Asistencia</div><div class="page-sub">Resumen local del Excel de marcajes de toda la empresa</div></div>`;
  if(ATTENDANCE_LOADING && !ATTENDANCE){
    return h + `<div class="table-wrap"><div class="empty-state"><div class="es-icon">🕘</div><p>Cargando asistencias...</p></div></div>`;
  }
  if(ATTENDANCE_ERROR){
    return h + `<div class="alert-banner"><div class="ab-icon">⚠️</div><div class="ab-text"><strong>No se pudo cargar la asistencia.</strong> ${ATTENDANCE_ERROR}</div></div>`;

    h+=`<div class="table-wrap"><div class="table-header">
      <div class="table-title">Ajustes de cargos y sueldos</div>
      <input class="search-input" id="attendanceSearch" placeholder="🔍 Nombre o DNI..." value="${state.attendanceSearch}" style="width:190px"/>
      <select class="filter-select" id="attendancePerson">

      <button class="btn-sm" id="attendanceRefresh">Actualizar</button>

    <table><thead><tr><th>Persona</th><th>Cargo</th><th>Sueldo mensual</th><th>Sueldo estimado del mes</th><th></th></tr></thead><tbody>`;

          </select>
        </td>
        <td><input class="search-input" data-payroll-salary="${person.personId}" type="number" min="0" step="0.01" value="${Number(person.monthlySalary||0).toFixed(2)}" style="width:130px"/></td>
        <td style="font-family:var(--font2);font-weight:700;color:var(--green)">S/ ${Number(person.estimatedSalary||0).toFixed(2)}</td>
        <td><button class="action-btn" data-payroll-save="${person.personId}">Guardar</button></td>
      </tr>`;
    });
    if(!(salaryData?.people||[]).length) h+=`<tr><td colspan="5"><div class="empty-state"><div class="es-icon">⚙️</div><p>No hay personas visibles para ajustar.</p></div></td></tr>`;
    h+=`</tbody></table></div>`;
    return h;
  }
  h+=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Integrantes detectados</div><div class="stat-value">${summary.totalPeople||0}</div><div class="stat-sub">${summary.totalDays||0} jornada(s) agrupadas</div></div>
    <div class="stat-card"><div class="stat-label">Tardanzas</div><div class="stat-value amber">${summary.lateEntries||0}</div><div class="stat-sub">Primer marcaje desde las 09:06</div></div>
    <div class="stat-card"><div class="stat-label">Faltas de salida</div><div class="stat-value red">${summary.missingExits||0}</div><div class="stat-sub">Solo se encontró entrada</div></div>
    <div class="stat-card"><div class="stat-label">Faltas de entrada</div><div class="stat-value red">${summary.missingEntries||0}</div><div class="stat-sub">Solo se encontró salida</div></div>

    h+=`<div class="table-wrap" style="margin-bottom:1.5rem"><div class="table-header">

    salaryData.people.forEach(person=>{
      h+=`<tr>
        <td><div style="font-weight:600">${person.personName}</div><div style="font-size:11px;color:var(--text3)">${person.personId}</div></td>

        <td>${person.totalBonusPoints}</td>
        <td style="font-family:var(--font2);font-size:18px;font-weight:700;color:var(--green)">S/ ${person.estimatedSalary.toFixed(2)}</td>
      </tr>`;
    });
    if(!salaryData.people.length) h+=`<tr><td colspan="8"><div class="empty-state"><div class="es-icon">💼</div><p>No hay personas para calcular sueldo con esos filtros.</p></div></td></tr>`;
    h+=`</tbody></table></div>`;
  }

  h+=`<div class="table-wrap" style="margin-bottom:1.5rem"><div class="table-header">
    <div class="table-title">Asistencia por día (${rows.length})</div>

    <select class="filter-select" id="attendanceDate">
      <option value="">Todas las fechas</option>
      ${(ATTENDANCE.availableDates||[]).map(date=>`<option value="${date}"${state.attendanceDate===date?' selected':''}>${fmt(date)}</option>`).join('')}
    </select>
    <button class="btn-sm" id="attendanceRefresh">Actualizar</button>
  </div>
  <table><thead><tr><th>Fecha</th><th>Persona</th><th>Entrada</th><th>Estado entrada</th><th>Salida</th><th>Estado salida</th><th>Tardanza</th><th>Minutos extra</th><th>Pago día</th><th>Estado del día</th><th></th></tr></thead><tbody>`;
  rows.forEach(row=>{
    const personProfile=(salaryData?.people||[]).find(person=>person.personId===row.personId) || { payrollRole:'Sin definir', monthlySalary:0 };
    const payment=computeAttendancePayment(row, personProfile);
    const entryClass=attendanceBadgeClass(row.entryTime ? (row.lateMinutes>0?'warn':'good') : 'danger');
    const exitClass=attendanceBadgeClass(row.exitTime ? 'done' : 'danger');
    const dayState=attendanceStatusMeta(row);
    const entryCell=`<div style="display:flex;align-items:center;gap:6px"><span style="font-family:var(--font2);font-weight:700">${shortTime(row.entryTime)}</span>${row.manualEntry?'<span class="badge drive">Manual</span>':''}</div>`;
    const exitCell=`<div style="display:flex;align-items:center;gap:6px"><span style="font-family:var(--font2);font-weight:700">${shortTime(row.exitTime)}</span>${row.manualExit?'<span class="badge drive">Manual</span>':''}</div>`;
    const editPayload=encodeURIComponent(JSON.stringify({personId:row.personId,personName:row.personName,date:row.date,entryTime:row.entryTime||'',exitTime:row.exitTime||''}));
    h+=`<tr>
      <td>${fmt(row.date)}</td>
      <td><div style="font-weight:600">${row.personName}</div><div style="font-size:11px;color:var(--text3)">${row.personId}</div></td>
      <td>${entryCell}</td>
      <td><span class="days-chip ${entryClass}">${row.entryStatus}</span></td>
      <td>${exitCell}</td>
      <td><span class="days-chip ${exitClass}">${row.exitStatus}</span></td>
      <td style="color:${row.lateMinutes>0?'var(--amber)':'var(--text2)'};font-weight:${row.lateMinutes>0?'700':'500'}">${minutesLabel(row.lateMinutes)}</td>
      <td style="color:${row.overtimeMinutes>0?'var(--green)':'var(--text2)'};font-weight:${row.overtimeMinutes>0?'700':'500'}">${minutesLabel(row.overtimeMinutes)}</td>
      <td style="font-weight:700;color:${payment.dailyPay>0?'var(--green)':'var(--text2)'}">S/ ${Number(payment.dailyPay||0).toFixed(2)}</td>
      <td><span class="days-chip ${dayState.cls}">${dayState.label}</span></td>
      <td><button class="action-btn" data-attendance-edit="${editPayload}">Editar</button></td>
    </tr>`;
  });
  if(!rows.length) h+=`<tr><td colspan="11"><div class="empty-state"><div class="es-icon">🗓️</div><p>No hay asistencias con esos filtros.</p></div></td></tr>`;
  h+=`</tbody></table></div>`;

  return h;
}

function dayChip(r){
  if(r.tipo==='operacion' && r.fechaOperacion) return `<span class="days-chip done">Operó en ${fmt(r.fechaOperacion)}</span>`;
  const d=recordAge(r);
  if(d>EXPIRE_DAY) return `<span class="days-chip expired">⛔ Expirado (${d}d)</span>`;
  if(d>=WARN_DAY) return `<span class="days-chip danger">⚠️ Día ${d}</span>`;
  return `<span class="days-chip ok">Día ${d}</span>`;
}

function renderAlertas(){
  const base=isEmployee()?RECORDS.filter(r=>r.userId===state.currentUser.id):getVisibleRecords();
  const dups=getDups(base);
  const warns=base.filter(r=>r.tipo==='registro'&&daysSince(r.fecha)===WARN_DAY);
  const expired=base.filter(r=>r.tipo==='registro'&&daysSince(r.fecha)>EXPIRE_DAY);
  const dupRecs=base.filter(r=>dups.has(r.id));
  const t=state.alertTab;
  const show=t==='expired'?expired:t==='dups'?dupRecs:warns;

  let h=`<div class="page-header"><div class="page-title">Centro de Alertas</div><div class="page-sub">${isEmployee()?'Tus clientes que requieren atención inmediata':'Clientes visibles que requieren atención inmediata'}</div></div>`;

  h+=`<div class="tabs">
    <div class="tab${t==='warn'?' active':''}" data-atab="warn">⏰ Día 6 (${warns.length})</div>
    <div class="tab${t==='expired'?' active':''}" data-atab="expired">⛔ Expirados (${expired.length})</div>

  <div class="table-wrap"><table><thead><tr><th>Cliente</th><th>DNI</th>${!isEmployee()?'<th>Atención al cliente</th>':''}<th>Fecha Registro</th><th>Días</th><th>Modalidad</th><th>Plataforma</th></tr></thead><tbody>`;
  show.forEach(r=>{
    const u=getUserById(r.userId);
    const d=daysSince(r.fecha);
    h+=`<tr><td>${r.cliente||'—'}</td><td><span style="font-family:var(--font2);font-weight:600">${r.dni}</span></td>
      ${!isEmployee()?`<td><div style="display:flex;align-items:center;gap:6px">${avatar(u,24,9)}${u.name}</div></td>`:''}
      <td>${fmt(r.fecha)}</td>
      <td><span class="days-chip ${d>7?'expired':'danger'}">Día ${d}</span></td>
      <td><span class="badge ${r.modalidad==='presencial'?'drive':'web'}">${r.modalidad==='presencial'?'🏢 Presencial':'💻 Virtual'}</span></td>
      <td><span class="badge ${r.plataforma}">${r.plataforma==='drive'?'📁 Drive':'🌐 Web'}</span></td></tr>`;
  });
  if(!show.length) h+=`<tr><td colspan="${isEmployee()?'6':'7'}"><div class="empty-state"><div class="es-icon">✅</div><p>¡Sin alertas en esta categoría!</p></div></td></tr>`;

function syncNuevoForm(){
  const tipoNuevo=document.getElementById('nt');
  const fechaOpNueva=document.getElementById('no');
  if(tipoNuevo&&fechaOpNueva){
    const run=()=>{
      if(tipoNuevo.value==='registro') fechaOpNueva.value='';
    };
    tipoNuevo.onchange=run;
    run();
  }

async function submitNuevoRegistro(){
  if(NEW_RECORD_SUBMITTING) return;
  const c=document.getElementById('nc')?.value.trim()||'';
  const d=document.getElementById('nd')?.value.trim()||'';
  const f=document.getElementById('nf')?.value||'';
  const fo=document.getElementById('no')?.value||'';
  const err=document.getElementById('nerr');
  const submitBtn=document.getElementById('nsub');
  const tipoSelect=document.getElementById('nt');
  const t=fo?'operacion':(tipoSelect?tipoSelect.value:'registro');
  if(!err) return;
  if(!c){ err.textContent='El nombre del cliente es obligatorio'; err.style.display='block'; return; }
  if(!d||d.length<6){ err.textContent='El DNI debe tener al menos 6 caracteres'; err.style.display='block'; return; }
  if(!f){ err.textContent='La fecha es obligatoria'; err.style.display='block'; return; }
  NEW_RECORD_SUBMITTING = true;
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.textContent = 'Guardando...';
    submitBtn.style.opacity = '0.7';
    submitBtn.style.cursor = 'wait';
  }
  try{
    await apiFetch('/api/records', {
      method:'POST',
      body:JSON.stringify({
        clientName:c,
        dni:d,
        registrationDate:f,
        operationDate:t==='operacion' ? fo || null : null,
        type:localToType(t),
        mode:localToMode(document.getElementById('nm').value),
        uploadPlatform:localToPlatform(document.getElementById('np').value),
        notes:document.getElementById('nn').value.trim() || null
      })
    });
    await refreshState();
    state.newModal=false;
    state.view='mis-registros';
    render();
  }catch(error){
    err.textContent=error.message || 'No se pudo guardar el registro';
    err.style.display='block';
  } finally {
    NEW_RECORD_SUBMITTING = false;
    if(submitBtn){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Guardar Registro';
      submitBtn.style.opacity = '';
      submitBtn.style.cursor = '';
    }
  }
}

function renderMisComisiones(){
  const u=state.currentUser;
  const my=isManager()?getCommissionableRecordsForUser(u):RECORDS.filter(r=>r.userId===u.id);
  const ops=my.filter(r=>!!r.validatedAt);
  const opsPending=isManager()?[]:my.filter(r=>isPendingApproval(r));
  const regs=isManager()?[]:my.filter(r=>r.tipo==='registro');
  const expired=regs.filter(r=>daysSince(r.fecha)>EXPIRE_DAY);
  const pending=regs.filter(r=>daysSince(r.fecha)<=EXPIRE_DAY);
  const total=calcUserCommission(u);

  let h=`<div class="page-header"><div class="page-title">Mis Comisiones</div><div class="page-sub">Resumen de lo que has ganado y lo que podrías ganar</div></div>
  <div class="commission-big">
    <div class="comm-label">💰 Total comisiones ganadas</div>
    <div class="comm-value">S/ ${total.toFixed(2)}</div>
    <div class="comm-sub">${ops.length} registro${ops.length===1?'':'s'} válido${ops.length===1?'':'s'} × S/ ${getCommissionRate().toFixed(2)} cada uno</div>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Operaciones validadas</div><div class="stat-value green">${ops.length}</div><div class="stat-sub">S/ ${total.toFixed(2)} ganados</div></div>
    <div class="stat-card"><div class="stat-label">Pendientes de aprobación</div><div class="stat-value amber">${opsPending.length}</div><div class="stat-sub">Esperando revisión</div></div>
    <div class="stat-card"><div class="stat-label">Registros en plazo</div><div class="stat-value amber">${pending.length}</div><div class="stat-sub">Potencial S/ ${(pending.length*getCommissionRate()).toFixed(2)}</div></div>
    <div class="stat-card"><div class="stat-label">Registros expirados</div><div class="stat-value red">${expired.length}</div><div class="stat-sub">Sin comisión</div></div>
  </div>
  <div class="table-wrap"><div class="table-header"><div class="table-title">Detalle — Operaciones validadas</div></div>
  <table><thead><tr><th>DNI</th><th>Registro</th><th>Operación</th><th>Modalidad</th><th>Plataforma</th><th>Comisión</th></tr></thead><tbody>`;
  ops.forEach(r=>{ h+=`<tr><td><span style="font-family:var(--font2);font-weight:600">${r.dni}</span></td><td>${fmt(r.fecha)}</td><td>${fmt(r.fechaOperacion)}</td><td>${r.modalidad==='presencial'?'Presencial':'Virtual'}</td><td><span class="badge ${r.plataforma}">${r.plataforma==='drive'?'📁 Drive':'🌐 Web'}</span></td><td style="color:var(--green);font-weight:700;font-family:var(--font2)">+S/ ${getCommissionRate().toFixed(2)}</td></tr>`; });
  if(!ops.length) h+=`<tr><td colspan="6"><div class="empty-state"><div class="es-icon">💰</div><p>Aún no tienes operaciones validadas. ¡Sigue adelante!</p></div></td></tr>`;
  h+='</tbody></table></div>';
  return h;
}

function renderModal(){

  const canEdit=(isAdmin()||r.userId===state.currentUser.id) && !locked;
  const canEditMode=(isAdmin()||isManager()||r.userId===state.currentUser.id);
  const canDelete=canDeleteRecord(r);
  const dis=canEdit?'':'disabled';
  const modeDis=canEditMode?'':'disabled';
  const validation=validationText(r);
  return `<div class="modal-overlay" id="moverlay">
    <div class="modal">
      <h3>${canEdit?'✏️ Editar Registro':'👁️ Ver Registro'} — DNI ${r.dni}</h3>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nombre del Cliente</label><input class="form-input" id="ec" value="${r.cliente||''}" disabled/></div>

        <div class="form-group"><label class="form-label">Tipo</label>
          <select class="form-select" id="et" ${dis}>
            <option value="registro"${r.tipo==='registro'?' selected':''}>Registro</option>
            <option value="operacion"${r.tipo==='operacion'?' selected':''}>Operación</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Fecha de Operación</label><input class="form-input" type="date" id="eo" value="${r.fechaOperacion||''}" ${dis}/></div>
        <div class="form-group"><label class="form-label">Modalidad</label>
          <select class="form-select" id="em" ${modeDis}>
            <option value="virtual"${r.modalidad==='virtual'?' selected':''}>💻 Virtual</option>
            <option value="presencial"${r.modalidad==='presencial'?' selected':''}>🏢 Presencial</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Plataforma</label>
          <select class="form-select" id="ep" ${dis}>
            <option value="web"${r.plataforma==='web'?' selected':''}>🌐 Web</option>
            <option value="drive"${r.plataforma==='drive'?' selected':''}>📁 Drive</option>
          </select>
        </div>
        <div class="form-group full"><label class="form-label">Notas</label><input class="form-input" id="en" value="${r.notas}" ${dis}/></div>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--text2)">Estado de validación: <span class="days-chip ${validation.cls}">${validation.label}</span></div>
      ${r.rejectedAt&&r.rejectionReason?`<div style="margin-top:8px;font-size:12px;color:var(--red)">Motivo de rechazo: ${r.rejectionReason}</div>`:''}
      ${state.currentUser.role==='admin'?`<div style="margin-top:8px;font-size:12px;color:var(--text2)">Subido: ${fmtDateTime(r.createdAt)}</div>`:''}
      <div class="modal-actions">
        <button class="btn-cancel" id="mclose">Cancelar</button>
        ${canDelete?`<button class="btn-sm danger" id="mdel">Eliminar</button>`:''}
        ${canValidateOrReject(r)?`<button class="btn-sm danger" id="mreject">Rechazar</button><button class="btn-sm success" id="mvalidate">Validar</button>`:''}
        ${(canEdit || canEditMode)?`<button class="btn-primary" id="msave" style="width:auto;padding:9px 20px">Guardar</button>`:''}

        await loadAttendance();
      }
    };
  });
  const lb=document.getElementById('logoutBtn');
  if(lb) lb.onclick=async()=>{
    stopAutoRefresh();
    showBusy('Cerrando sesión...');

      await fetch('/api/auth/logout', { method:'POST', credentials:'same-origin' });
    } finally {
      hideBusy();
    }
    state.currentUser=null;
    state.resetUserId=null;
    state.sessionPassword='';
    state.view='login';
    render();
  };

  // filters

  bindFilter('ft','ft'); bindFilter('fu','fUser'); bindFilter('ftp','fTipo');
  bindFilter('fap','fApproval'); bindFilter('fs','fSede');
  bindFilter('fd','fDesde'); bindFilter('fh','fHasta');
  bindFilter('attendanceSearch','attendanceSearch');
  bindFilter('attendanceDate','attendanceDate');
  bindFilter('attendancePerson','attendancePerson');
  document.querySelectorAll('[data-attendance-tab]').forEach(el=>{ el.onclick=()=>{ state.attendanceTab=el.dataset.attendanceTab; render(); }; });
  const reportModeEl=document.getElementById('reportMode');
  if(reportModeEl) reportModeEl.onchange=()=>{
    state.reportMode=reportModeEl.value;
    if(state.reportMode==='all') state.reportUser='';
    render();
  };
  const reportUserEl=document.getElementById('reportUser');
  if(reportUserEl) reportUserEl.onchange=()=>{ state.reportUser=reportUserEl.value; render(); };

  // alert tabs
  document.querySelectorAll('[data-atab]').forEach(el=>{ el.onclick=()=>{ state.alertTab=el.dataset.atab; render(); }; });
  document.querySelectorAll('[data-atab2]').forEach(el=>{ el.onclick=()=>{ state.adminTab=el.dataset.atab2; render(); }; });

  // edit btns
  document.querySelectorAll('[data-edit]').forEach(el=>{ el.onclick=()=>{ state.modal=parseInt(el.dataset.edit); render(); }; });
  document.querySelectorAll('[data-validate]').forEach(el=>{ el.onclick=async()=>{ await validateRecord(parseInt(el.dataset.validate)); render(); }; });
  document.querySelectorAll('[data-reject]').forEach(el=>{ el.onclick=async()=>{ const reason=prompt('Motivo del rechazo:'); if(reason&&reason.trim()){ await rejectRecord(parseInt(el.dataset.reject), reason.trim()); render(); } }; });

  // go nuevo
  const gn=document.getElementById('goNuevo');
  if(gn) gn.onclick=()=>{ state.newModal=true; render(); };

  // admin: save user
  const su=document.getElementById('saveUserBtn');
  if(su) su.onclick=async()=>{
    if(!canManageUsers()) return;
    const n=document.getElementById('an').value.trim();
    const u=document.getElementById('au').value.trim();
    const p=document.getElementById('ap').value.trim();
    const role=document.getElementById('ar').value;
    const sede=isAdmin()?document.getElementById('as').value:userSede(state.currentUser);
    if(!n||!u||!p) return;
    if(!canManageUserRole(role)) return;
    try{
      await apiFetch('/api/users', {
        method:'POST',
        body:JSON.stringify({ name:n, username:u, password:p, role:localToRole(role), sede })
      });
      await refreshState();
      state.adminTab='users';
      render();
    }catch(error){
      alert(error.message || 'No se pudo crear la atención al cliente.');
    }
  };

  const sc=document.getElementById('saveCommissionBtn');
  if(sc) sc.onclick=async()=>{
    const rate=Number(document.getElementById('commissionRate').value);
    if(Number.isNaN(rate) || rate<0) return;
    try{
      await apiFetch('/api/settings/commission', {
        method:'POST',
        body:JSON.stringify({ commissionPerRecord: rate })
      });
      await refreshState();
      render();
    }catch(error){
      alert(error.message || 'No se pudo guardar la comisión.');
    }
  };

  const sap=document.getElementById('saveAdminPasswordBtn');
  if(sap) sap.onclick=async()=>{
    const current=document.getElementById('adminCurrentPass').value;
    const next=document.getElementById('adminNewPass').value;
    const repeat=document.getElementById('adminRepeatPass').value;
    try{
      await apiFetch('/api/settings/password', {
        method:'POST',
        body:JSON.stringify({ currentPassword:current, newPassword:next, repeatPassword:repeat })
      });
      state.sessionPassword=next;
      await refreshState();
      alert('Contraseña de admin actualizada.');
      render();
    }catch(error){
      alert(error.message || 'No se pudo cambiar la contraseña.');
    }
  };

  document.querySelectorAll('[data-eu]').forEach(el=>{
    el.onclick=async()=>{
      const user=USERS.find(x=>x.id==el.dataset.eu);
      if(!user || !canManageUser(user)) return;
      const newName=prompt('Editar nombre:', user.name);
      if(!newName) return;
      let role=user.role;
      let sede=user.sede;
      if(isAdmin()){
        const newRole=prompt('Rol (manager o employee):', user.role);
        if(newRole==='manager' || newRole==='employee') role=newRole;
        const newSede=prompt(`Sede (${SEDES.join(', ')}):`, user.sede);
        if(newSede && SEDES.includes(newSede)) sede=newSede;
      }
      try{
        await apiFetch(`/api/users/${user.id}`, {
          method:'PATCH',
          body:JSON.stringify({ name:newName.trim()||user.name, role:localToRole(role), sede })
        });
        await refreshState();
        render();
      }catch(error){
        alert(error.message || 'No se pudo editar la atención al cliente.');
      }
    };
  });

  // admin: delete user
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick=async()=>{ if(confirm('¿Eliminar esta atención al cliente?')){ try{ await apiFetch(`/api/users/${el.dataset.del}`, { method:'DELETE' }); await refreshState(); render(); }catch(error){ alert(error.message || 'No se pudo eliminar la atención al cliente.'); } } };
  });

  // admin: reset pass

    el.onclick=async()=>{

        try{

            method:'POST',
            body:JSON.stringify({ password: np })

          alert('Contraseña actualizada');
          render();
        }catch(error){
          alert(error.message || 'No se pudo cambiar la contraseña.');

    };

  const exportBtn=document.getElementById('exportPdfBtn');
  if(exportBtn) exportBtn.onclick=()=>{

      alert('Selecciona una atención al cliente para descargar el reporte individual.');
      return;

    const selectedUser=getReportableUsers().find(u=>u.id==state.reportUser);

e atención al cliente'}</h2><table><thead><tr><th>Cliente</th><th>DNI</th>${state.reportMode==='all'?'<th>Atención al cliente</th><th>Sede</th>':''}<th>Registro</th><th>Operación</th><th>Validado</th><th>Modalidad</th><th>Plataforma</th><th>Comisión</th></tr></thead><tbody>${rows||`<tr><td colspan="${state.reportMode==='all'?10:8}">Sin registros validados.</td></tr>`}</tbody></table><script>window.onload=()=>window.print();<\/script></body></html>`);
    w.document.close();
  };

  const attendanceRefresh=document.getElementById('attendanceRefresh');
  if(attendanceRefresh) attendanceRefresh.onclick=async()=>{ await loadAttendance(true); };

  document.querySelectorAll('[data-attendance-edit]').forEach(el=>{
    el.onclick=()=>{
      try{
        state.attendanceEdit=JSON.parse(decodeURIComponent(el.dataset.attendanceEdit));
        render();
      }catch(error){
        alert('No se pudo abrir la edición de asistencia.');
      }
    };
  });

  document.querySelectorAll('[data-payroll-save]').forEach(el=>{
    el.onclick=async()=>{
      const personId=el.dataset.payrollSave;
      const roleEl=document.querySelector(`[data-payroll-role="${personId}"]`);
      const salaryEl=document.querySelector(`[data-payroll-salary="${personId}"]`);
      if(!personId || !roleEl || !salaryEl) return;
      try{
        ATTENDANCE = await apiFetch('/api/attendance', {
          method:'POST',
          body:JSON.stringify({
            action:'profile',
            personId,
            payrollRole: roleEl.value,
            monthlySalary: Number(salaryEl.value || 0)
          }),
          busyMessage:'Guardando cargo y sueldo...'
        });
        ATTENDANCE_ERROR='';
        preserveMainScroll(()=>render());
      }catch(error){
        alert(error.message || 'No se pudo guardar el cargo y sueldo.');
      }
    };
  });
}

function bindAttendanceEditModal(){
  const overlay=document.getElementById('aoverlay');
  const close=document.getElementById('attendanceEditClose');
  const save=document.getElementById('attendanceEditSave');
  if(overlay) overlay.onclick=e=>{ if(e.target===overlay){ state.attendanceEdit=null; render(); } };
  if(close) close.onclick=()=>{ state.attendanceEdit=null; render(); };
  if(save) save.onclick=async()=>{
    const item=state.attendanceEdit;
    if(!item) return;
    const entry=document.getElementById('attendanceEntryEdit')?.value?.trim();
    const exit=document.getElementById('attendanceExitEdit')?.value?.trim();
    if(!entry && !exit){
      alert('Debes poner al menos una hora.');
      return;
    }
    try{
      if(entry){
        ATTENDANCE = await apiFetch('/api/attendance', {
          method:'POST',
          body:JSON.stringify({ personId:item.personId, date:item.date, field:'entryTime', value:entry }),
          busyMessage:'Guardando entrada manual...'
        });
      }
      if(exit){
        ATTENDANCE = await apiFetch('/api/attendance', {
          method:'POST',
          body:JSON.stringify({ personId:item.personId, date:item.date, field:'exitTime', value:exit }),
          busyMessage:'Guardando salida manual...'
        });
      }
      ATTENDANCE_ERROR='';
      state.attendanceEdit=null;
      render();
    }catch(error){
      alert(error.message || 'No se pudo guardar la asistencia.');
    }
  };
}

function bindModal(){
  const ov=document.getElementById('moverlay');
  const mc=document.getElementById('mclose');
  const ms=document.getElementById('msave');
  const md=document.getElementById('mdel');
  const mv=document.getElementById('mvalidate');
  const mr=document.getElementById('mreject');
  const tipoEdit=document.getElementById('et');
  const fechaOpEdit=document.getElementById('eo');
  if(tipoEdit&&fechaOpEdit){
    const syncEdit=()=>{
      if(tipoEdit.value==='registro') fechaOpEdit.value='';
    };
    tipoEdit.onchange=syncEdit;
  }
  if(ov) ov.onclick=e=>{ if(e.target===ov){ state.modal=null; render(); } };
  if(mc) mc.onclick=()=>{ state.modal=null; render(); };
  if(ms) ms.onclick=async()=>{
    if(EDIT_RECORD_SUBMITTING) return;
    const current=RECORDS.find(r=>r.id===state.modal);
    if(!current) return;
    EDIT_RECORD_SUBMITTING = true;
    ms.disabled = true;
    ms.textContent = 'Guardando...';
    ms.style.opacity = '0.7';
    ms.style.cursor = 'wait';
    const locked=isApprovalLocked(current);
    const selectedTipo=document.getElementById('et').value;
    const fechaOperacion=document.getElementById('eo').value;
    const tipo=fechaOperacion?'operacion':selectedTipo;
    if(!locked && selectedTipo==='operacion'&&!fechaOperacion){ alert('Debes indicar la fecha de operación para marcar este registro como operación.'); return; }
    try{
      await apiFetch(`/api/records/${state.modal}`, {
        method:'PATCH',
        body:JSON.stringify({
          type:localToType(locked ? current.tipo : tipo),
          operationDate:locked ? (current.fechaOperacion || null) : (tipo==='operacion'?fechaOperacion || null:null),
          mode:localToMode(document.getElementById('em').value),
          uploadPlatform:localToPlatform(locked ? current.plataforma : document.getElementById('ep').value),
          notes:locked ? (current.notas || null) : (document.getElementById('en').value.trim() || null)
        })
      });
      await refreshState();
      state.modal=null;
      render();
    }catch(error){
      alert(error.message || 'No se pudo guardar el registro.');
    } finally {
      EDIT_RECORD_SUBMITTING = false;
      if(ms){
        ms.disabled = false;
        ms.textContent = 'Guardar';
        ms.style.opacity = '';
        ms.style.cursor = '';
      }
    }
  };
  if(mv) mv.onclick=async()=>{ await validateRecord(state.modal); state.modal=null; render(); };
  if(mr) mr.onclick=async()=>{
    const reason=prompt('Motivo del rechazo:');
    if(reason&&reason.trim()){ await rejectRecord(state.modal, reason.trim()); state.modal=null; render(); }
  };
  if(md) md.onclick=async()=>{
    const rec=RECORDS.find(r=>r.id===state.modal);
    if(!canDeleteRecord(rec)) return;
    if(confirm('¿Eliminar este registro?')){
      try{
        await apiFetch(`/api/records/${state.modal}`, { method:'DELETE' });
        await refreshState();
        state.modal=null;
        render();
      }catch(error){
        alert(error.message || 'No se pudo eliminar el registro.');
      }
    }
  };
}

function bindNuevoModal(){
  const ov=document.getElementById('noverlay');
  const close=document.getElementById('nclose');
  const submit=document.getElementById('nsub');
  syncNuevoForm();
  if(ov) ov.onclick=e=>{ if(e.target===ov){ state.newModal=false; render(); } };
  if(close) close.onclick=()=>{ state.newModal=false; render(); };
  if(submit) submit.onclick=submitNuevoRegistro;
}

boot();

</script>
